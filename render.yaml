# render: New > Blueprint > pick this repo, then add LLM_API_KEY
services:
  - type: web
    name: ai-link-analysis
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: openrouter          # or anthropic + ANTHROPIC_API_KEY
      - key: LLM_API_KEY
        sync: false                # set in the dashboard, not here
      - key: RATE_LIMIT_PER_MINUTE
        value: "5"
