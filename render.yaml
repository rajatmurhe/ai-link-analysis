# One-click deploy on Render: New → Blueprint → select this repo, then set LLM_API_KEY.
services:
  - type: web
    name: ai-link-analysis
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: openrouter          # free models; switch to "anthropic" + ANTHROPIC_API_KEY for production
      - key: LLM_API_KEY
        sync: false                # your OpenRouter key (https://openrouter.ai/keys)
      - key: RATE_LIMIT_PER_MINUTE
        value: "5"
